<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>{{ title }} · 在线阅读</title>
<link rel="stylesheet" href="/library/static/style.css">
<style>
  /* 阅读区：限宽 + 大行距，长时间看不累 */
  .reader-wrap {
    max-width: 760px;
    margin: 0 auto;
    padding: 0 20px 80px;
  }

  .reader-head {
    padding: 8px 0 20px;
    border-bottom: 1px solid rgba(255,255,255,.12);
    margin-bottom: 28px;
  }

  .reader-head h1 {
    font-size: 26px;
    margin-bottom: 6px;
    letter-spacing: .04em;
  }

  .reader-meta {
    font-size: 13px;
    color: #8a8a8a;
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    align-items: center;
  }

  .reader-meta a { color: #bbb; }

  .reader-tools {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  #text {
    font-size: 17px;
    line-height: 2;
    letter-spacing: .02em;
    color: #e8e8e8;
    white-space: pre-wrap;
    word-break: break-word;
  }

  /* 中文书籍首行缩进两格更好读，英文不缩进 */
  #text.zh p { text-indent: 2em; margin-bottom: .4em; }
  #text.en p { text-indent: 0; margin-bottom: 1em; }

  .loading { color: #555; text-align: center; padding: 60px 0; }

  /* 底部回到顶部 */
  #toTop {
    position: fixed;
    right: 20px; bottom: 24px;
    width: 44px; height: 44px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.3);
    background: rgba(0,0,0,.6);
    color: #fff; font-size: 18px;
    cursor: pointer;
    display: none;
    z-index: 5;
  }
  #toTop:hover { background: rgba(255,255,255,.15); }

  /* 阅读进度条 */
  #progress {
    position: fixed; top: 0; left: 0;
    height: 2px; width: 0;
    background: #fff;
    z-index: 10;
    transition: width .1s linear;
  }
</style>
</head>
<body>

<div id="progress"></div>

<nav class="nav">
  <a href="/" class="brand">个人网站</a>
  <div class="links">
    <a href="/">首页</a>
    <a href="/control">机械臂</a>
    <a href="/library/" class="on">图书管理</a>
    <a href="/messages">留言板</a>
  </div>
</nav>

<div class="reader-wrap">
  <div class="reader-head">
    <h1>{{ title }}</h1>
    <div class="reader-meta">
      <span>{{ author }}</span>
      {% if source %}<span>来源：{{ source }}</span>{% endif %}
      {% if source_url %}<a href="{{ source_url }}" target="_blank" rel="noopener">原始页面 ↗</a>{% endif %}
    </div>
    <div class="reader-tools">
      <a href="/library/"><button class="sm">← 返回书库</button></a>
      <button class="sm" id="btn-font-down">字小一点</button>
      <button class="sm" id="btn-font-up">字大一点</button>
    </div>
  </div>

  <div id="text"><div class="loading">正在载入全文…</div></div>
</div>

<button id="toTop" onclick="scrollTo({top:0,behavior:'smooth'})">↑</button>

<script src="/starfield.js"></script>
<script>
  const resourceId = {{ resource_id | tojson }};
  const isChinese = {{ is_chinese | tojson }};

  const textEl = document.getElementById('text');
  let fontSize = 17;

  async function loadText() {
    try {
      const res = await fetch(`/library/api/book/${resourceId}/text`);
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const raw = await res.text();

      // 按空行切段，渲染成 <p> —— 比直接 white-space:pre 更好控制排版
      textEl.className = isChinese ? 'zh' : 'en';
      textEl.innerHTML = raw
        .split(/\n\s*\n/)
        .map(p => p.trim())
        .filter(Boolean)
        .map(p => '<p>' + p.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])) + '</p>')
        .join('');
    } catch (e) {
      textEl.innerHTML = '<div class="loading">载入失败：' + e.message + '</div>';
    }
  }

  // 字号调节
  document.getElementById('btn-font-up').onclick = () => {
    fontSize = Math.min(26, fontSize + 1);
    textEl.style.fontSize = fontSize + 'px';
  };
  document.getElementById('btn-font-down').onclick = () => {
    fontSize = Math.max(13, fontSize - 1);
    textEl.style.fontSize = fontSize + 'px';
  };

  // 阅读进度 + 回到顶部按钮
  addEventListener('scroll', () => {
    const h = document.documentElement;
    const pct = h.scrollTop / (h.scrollHeight - h.clientHeight) * 100;
    document.getElementById('progress').style.width = pct + '%';
    document.getElementById('toTop').style.display = h.scrollTop > 400 ? 'block' : 'none';
  });

  loadText();
</script>
</body>
</html>
